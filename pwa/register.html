<script>
// Webbappen: registrera service workern (offline) och be webbläsaren att inte rensa sparade framsteg.
(function () {
  if (!('serviceWorker' in navigator) || !/^https?:/.test(location.protocol)) return;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { }); } catch (e) { }
  window.addEventListener('load', function () {
    var had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(function (r) { try { r.update(); } catch (e) { } }).catch(function () { });
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!had) return;
      var t = document.createElement('div');
      t.textContent = '🆕 Ny version av TURBO-RACE är nedladdad – starta om spelet när loppet är klart.';
      t.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:#1a1033;color:#fff;border:3px solid #76ff03;border-radius:14px;padding:10px 18px;font:bold 17px Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.5)';
      document.body.appendChild(t); setTimeout(function () { t.remove(); }, 9000);
    });
  });
})();
</script>
